<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found — Stackly Organic Farm</title>
  <meta name="description" content="The page you are looking for was not found on Stackly Organic Farm. Return to home or step back to your previous page.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --forest: #1F3B2C;
      --forest-2: #122318;
      --wheat: #D4A544;
      --wheat-2: #E9C876;
      --clay: #A6613A;
      --cream: #F6F1E4;
      --paper: #FCFAF3;
      --sage: #7C9473;
      --ink: #1B211E;
      --ink-soft: #4A5550;
      --line: rgba(31,59,44,0.12);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; font-family:'Inter', sans-serif; background:var(--forest-2); color:var(--paper); }
    body { min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden; position:relative; }

    /* Top Announcement Bar */
    .announce-bar {
      background: linear-gradient(90deg, #122318 0%, #1F3B2C 50%, #122318 100%);
      color: var(--wheat-2); font-size:0.8rem; font-weight:500; text-align:center; padding:9px 16px;
      border-bottom:1px solid rgba(212,165,68,0.2); font-family:'JetBrains Mono', monospace; letter-spacing:0.04em;
    }

    /* Site Header */
    header {
      position:sticky; top:0; z-index:1000; background:rgba(18,35,24,0.92); backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(252,250,243,0.1); padding:16px 0; transition:all 0.3s ease;
    }
    .wrap { max-width:1240px; margin:0 auto; padding:0 24px; }
    .header-inner { display:flex; align-items:center; justify-content:space-between; gap:20px; }
    
    .logo-wrap { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--paper); }
    .logo-img { height:40px; width:auto; display:block; }

    nav.links { display:flex; gap:24px; align-items:center; }
    nav.links a {
      font-size:0.9rem; font-weight:500; color:rgba(252,250,243,0.85); text-decoration:none;
      position:relative; padding-bottom:4px; transition:color 0.3s ease;
    }
    nav.links a:hover, nav.links a.active { color:var(--wheat-2); }
    
    .nav-btn-login {
      background:var(--wheat); color:var(--forest-2); font-weight:700; font-size:0.85rem;
      padding:9px 20px; border-radius:100px; text-decoration:none; transition:all 0.3s ease;
      box-shadow:0 4px 14px rgba(212,165,68,0.3);
    }
    .nav-btn-login:hover { background:var(--wheat-2); transform:translateY(-2px); }

    /* Mobile Menu Toggle */
    .menu-btn { display:none; background:none; border:none; color:var(--paper); font-size:1.6rem; cursor:pointer; }
    @media (max-width:960px){
      nav.links { display:none; }
      .menu-btn { display:block; }
    }

    /* Main 404 Hero Section */
    .hero-404 {
      flex:1; padding:100px 0 120px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px;
      position:relative; text-align:center;
      background:radial-gradient(circle at 50% 40%, rgba(31,59,44,0.6) 0%, rgba(18,35,24,0.98) 100%),
                 url('images/farm_img_015.webp') center center / cover no-repeat;
    }

    .container-404 { max-width:760px; padding:0 24px; position:relative; z-index:2; }

    .eyebrow-404 {
      display:inline-flex; align-items:center; gap:8px; background:rgba(212,165,68,0.14); border:1px solid var(--wheat);
      color:var(--wheat-2); padding:6px 18px; border-radius:100px; font-family:'JetBrains Mono', monospace;
      font-size:0.78rem; text-transform:uppercase; letter-spacing:0.12em; margin-bottom:24px;
    }

    .number-404 {
      font-family:'Fraunces', serif; font-size:clamp(6rem, 15vw, 11rem); font-weight:700; line-height:0.9;
      background:linear-gradient(180deg, #E9C876 0%, #D4A544 60%, #A6613A 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      filter:drop-shadow(0 15px 30px rgba(0,0,0,0.5)); margin-bottom:10px;
    }

    .title-404 {
      font-family:'Fraunces', serif; font-size:clamp(2rem, 4vw, 3rem); font-weight:600; color:var(--paper); margin-bottom:18px;
    }

    .desc-404 {
      font-size:1.05rem; color:rgba(252,250,243,0.78); line-height:1.65; max-width:620px; margin:0 auto 40px;
    }

    /* Buttons Row */
    .btns-row-404 { display:flex; gap:16px; justify-content:center; align-items:center; flex-wrap:wrap; }

    .btn-home-404 {
      background:var(--wheat); color:var(--forest-2); font-weight:700; font-size:0.95rem; padding:15px 32px;
      border-radius:100px; text-decoration:none; display:inline-flex; align-items:center; gap:10px;
      transition:all 0.3s ease; box-shadow:0 8px 25px rgba(212,165,68,0.35); font-family:'Inter', sans-serif;
    }
    .btn-home-404:hover { background:var(--wheat-2); transform:translateY(-3px); box-shadow:0 12px 30px rgba(212,165,68,0.45); }

    .btn-back-404 {
      background:rgba(252,250,243,0.08); border:1px solid rgba(252,250,243,0.22); color:var(--paper);
      font-weight:600; font-size:0.95rem; padding:15px 32px; border-radius:100px; cursor:pointer;
      display:inline-flex; align-items:center; gap:10px; transition:all 0.3s ease; font-family:'Inter', sans-serif;
    }
    .btn-back-404:hover { background:rgba(252,250,243,0.18); border-color:var(--wheat); color:var(--wheat-2); transform:translateY(-3px); }

    /* Footer Section */
    footer {
      position:relative; background:url('images/farm_img_015.webp') center center / cover no-repeat;
      overflow:hidden; border-top:1px solid rgba(212,165,68,0.2);
    }
    .footer-overlay {
      position:relative; z-index:2; background:linear-gradient(180deg, rgba(18,35,24,0.94) 0%, rgba(18,35,24,0.98) 100%);
      padding:70px 0 30px;
    }
    .footer-contact-row { display:grid; grid-template-columns:repeat(3, 1fr); gap:30px; padding-bottom:40px; border-bottom:1px solid rgba(212,165,68,0.25); margin-bottom:50px; }
    @media (max-width:900px){ .footer-contact-row{grid-template-columns:1fr; gap:24px;} }

    .footer-contact-item { display:flex; align-items:center; gap:18px; }
    .footer-contact-icon {
      width:54px; height:54px; border-radius:50%; background:var(--wheat); color:var(--forest-2);
      display:flex; align-items:center; justify-content:center; font-size:1.3rem; flex-shrink:0;
      box-shadow:0 8px 22px rgba(212,165,68,0.35); transition:transform 0.3s ease;
    }
    .footer-contact-item:hover .footer-contact-icon { transform:scale(1.1) rotate(6deg); }
    .footer-contact-info label { display:block; font-weight:700; color:var(--paper); font-size:0.95rem; margin-bottom:4px; }
    .footer-contact-info p { color:rgba(252,250,243,0.75); font-size:0.86rem; line-height:1.45; margin:0; }

    .footer-main-grid { display:grid; grid-template-columns:1.3fr 1fr 1fr 1.3fr; gap:44px; padding-bottom:50px; }
    @media (max-width:1024px){ .footer-main-grid{grid-template-columns:1fr 1fr; gap:36px;} }
    @media (max-width:600px){ .footer-main-grid{grid-template-columns:1fr; gap:32px;} }

    .footer-brand { display:flex; flex-direction:column; align-items:flex-start; text-align:left; }
    .footer-logo-wrap { display:block !important; margin-bottom:18px !important; text-decoration:none !important; }
    .footer-logo-pic { height:44px !important; width:auto !important; max-width:210px !important; object-fit:contain !important; display:block !important; }
    .footer-brand p { color:rgba(252,250,243,0.75); font-size:0.9rem; line-height:1.65; margin:0 0 22px 0; max-width:320px; }

    .footer-socials { display:flex; gap:12px; align-items:center; }
    .footer-social-link {
      width:40px; height:40px; border-radius:50%; background:rgba(252,250,243,0.08);
      border:1px solid rgba(252,250,243,0.18); color:var(--paper); display:flex; align-items:center;
      justify-content:center; transition:all 0.3s ease; text-decoration:none;
    }
    .footer-social-link:hover { background:var(--wheat); color:var(--forest-2); border-color:var(--wheat); transform:translateY(-4px); }

    .footer-col h4 { font-family:'Fraunces', serif; font-size:1.2rem; font-weight:600; color:var(--paper); margin-bottom:20px; position:relative; padding-bottom:8px; display:inline-block; }
    .footer-col h4::after { content:""; position:absolute; bottom:0; left:0; width:36px; height:3px; background:var(--wheat); border-radius:3px; }
    .footer-col a { display:block; color:rgba(252,250,243,0.75); text-decoration:none; margin-bottom:10px; font-size:0.9rem; transition:color 0.3s ease; }
    .footer-col a:hover { color:var(--wheat-2); padding-left:4px; }

    .footer-bottom-bar {
      border-top:1px solid rgba(252,250,243,0.12); padding-top:26px; display:flex; justify-content:space-between;
      align-items:center; font-size:0.85rem; color:rgba(252,250,243,0.65); flex-wrap:wrap; gap:16px;
    }
    .footer-bottom-links { display:flex; gap:20px; align-items:center; }
    .footer-bottom-links a { color:rgba(252,250,243,0.65); text-decoration:none; }
    .footer-bottom-links a:hover { color:var(--wheat-2); }
    .footer-to-top-btn {
      width:38px; height:38px; border-radius:50%; background:var(--wheat); color:var(--forest-2);
      display:inline-flex; align-items:center; justify-content:center; text-decoration:none; font-weight:bold;
      box-shadow:0 6px 16px rgba(212,165,68,0.3); transition:transform 0.3s ease;
    }
    .footer-to-top-btn:hover { transform:scale(1.15); background:var(--wheat-2); }
  </style>
</head>
<body>

  <!-- 404 Hero Content -->
  <script>
    function goBack404() {
      if (document.referrer && document.referrer.indexOf('404.html') === -1) {
        window.location.href = document.referrer;
        return;
      }
      if (window.history.length > 1) {
        window.history.back();
        return;
      }
      window.location.href = 'home.html';
    }
  </script>
  <main class="hero-404">
    <div class="container-404">
      <div class="eyebrow-404">🚜 Uncharted Field Territory</div>
      <div class="number-404">404</div>
      <h1 class="title-404">Oops! You've Wandered Off the Farm Path</h1>
      <p class="desc-404">The page or social link you are looking for might have been moved, harvested early, or is temporarily undergoing crop rotation in our digital fields.</p>

      <div class="btns-row-404">
        <a href="home.html" class="btn-home-404">
          <span>🏡</span> Go to Home
        </a>
        <button type="button" class="btn-back-404" onclick="goBack404()">
          <span>↩️</span> Previous Page
        </button>
      </div>
    </div>
  </main>

</body>
</html>
